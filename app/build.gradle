apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'

if (project.hasProperty('isolatedBuildDir')) {
    buildDir = rootProject.file('.codex-build/app')
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def readApiKey = { String name ->
    localProperties.getProperty(name)
            ?: project.findProperty(name)
            ?: System.getenv(name)
            ?: ''
}
def escapeBuildConfigString = { value -> value.toString()
        .replace('\\', '\\\\')
        .replace('"', '\\"')
}
def coindeskApiKey = readApiKey('COINDESK_API_KEY')
def cryptoCompareApiKey = readApiKey('CRYPTOCOMPARE_API_KEY') ?: coindeskApiKey
def escapedCoindeskApiKey = escapeBuildConfigString(coindeskApiKey)
def escapedCryptoCompareApiKey = escapeBuildConfigString(cryptoCompareApiKey)

android {
    namespace = "app.khom.pavlo.crypto"

    compileSdk = 36

    defaultConfig {
        applicationId = "app.khom.pavlo.crypto"
        minSdk = 23
        targetSdk = 36
        versionCode = 20
        versionName = "1.2.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "COINDESK_API_KEY", "\"${escapedCoindeskApiKey}\""
        buildConfigField "String", "CRYPTOCOMPARE_API_KEY", "\"${escapedCryptoCompareApiKey}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation": "$projectDir/schemas".toString()
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }

    sourceSets {
        test.java.srcDirs += 'src/test/kotlin'
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.58'
    kapt 'com.google.dagger:hilt-compiler:2.58'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava3:3.0.0'

    // RxJava
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'com.jakewharton.rxbinding4:rxbinding:4.0.0'

    // Room
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.room:room-rxjava3:2.8.4"
    kapt "androidx.room:room-compiler:2.8.4"

    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

}
