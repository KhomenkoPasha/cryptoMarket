plugins {
    id 'com.android.application'
    id 'com.android.legacy-kapt'
    id 'com.google.dagger.hilt.android'
}

apply from: rootProject.file('gradle/app-config.gradle')

if (project.hasProperty('isolatedBuildDir')) {
    buildDir = rootProject.file('.codex-build/app')
}

def appConfig = cryptoMarketAppConfig
def appEnvironment = loadCryptoMarketEnvironment(project)
def releaseSigning = appEnvironment.signing

android {
    namespace = appConfig.namespace
    compileSdk = appConfig.compileSdk

    defaultConfig {
        applicationId = appConfig.applicationId
        minSdk = appConfig.minSdk
        targetSdk = appConfig.targetSdk
        versionCode = appConfig.versionCode
        versionName = appConfig.versionName

        testInstrumentationRunner = appConfig.testRunner

        buildConfigField 'String', 'COINDESK_API_KEY', appEnvironment.apiKeys.coindesk
        buildConfigField 'String', 'CRYPTOCOMPARE_API_KEY', appEnvironment.apiKeys.cryptoCompare

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        if (releaseSigning.configured) {
            release {
                storeFile = releaseSigning.storeFile
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigning.configured) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        abortOnError = true
        checkTestSources = false
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX
    implementation libs.androidx.appcompat
    implementation libs.androidx.cardview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.viewpager2
    implementation libs.androidx.work.runtime.ktx

    // Dependency injection and persistence
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.rxjava3
    kapt libs.androidx.room.compiler

    // Networking
    implementation libs.retrofit.core
    implementation libs.retrofit.converter.gson
    implementation libs.retrofit.adapter.rxjava3

    // Reactive streams
    implementation libs.rxjava
    implementation libs.rxandroid
    implementation libs.rxbinding

    // UI, charts, images and ads
    implementation libs.material
    implementation libs.play.services.ads
    implementation libs.picasso
    implementation libs.android.spin.kit
    implementation libs.mpandroidchart

    // Tests
    testImplementation libs.kotlin.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.core.ktx
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.room.testing

    // Debug diagnostics
    debugImplementation libs.leakcanary.android
}

tasks.register('releaseSigningStatus') {
    group = 'verification'
    description = 'Checks whether release signing is configured without printing secrets.'

    doLast {
        if (releaseSigning.configured) {
            println "Release signing is configured: ${releaseSigning.storeFile.absolutePath}, " +
                    "alias=${releaseSigning.keyAlias}"
            return
        }

        throw new GradleException(
                "Release signing is not configured. Missing: ${releaseSigning.missing.join(', ')}. " +
                        'Add the values to local.properties or environment variables.'
        )
    }
}

// AGP 9.2 can inspect transient release kapt sources while Hilt regenerates them when
// lintDebug and assembleRelease run together. Serialize only the affected analyses.
tasks.matching {
    it.name == 'lintAnalyzeDebugUnitTest' || it.name == 'lintAnalyzeDebugAndroidTest'
}.configureEach {
    mustRunAfter('assembleRelease')
}
